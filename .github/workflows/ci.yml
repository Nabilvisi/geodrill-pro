name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            apps/streamlit/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Install runtime and cloud test dependencies
        run: python -m pip install -r apps/streamlit/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check and build workstation frontend
        run: |
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm exec vite build
      - name: Run full regression and source benchmarks
        run: python -m pytest -q --junitxml=build/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: build/ci-tests.xml
