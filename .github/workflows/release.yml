name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      unsigned_research:
        description: Build unsigned research artifacts as a prerelease
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          pnpm install --frozen-lockfile
      - name: Run regression and build current frontend
        run: |
          python -m pytest -q --junitxml=build/release-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_streamlit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select signing mode and build portable package
        shell: pwsh
        env:
          GEODRILL_SIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          GEODRILL_SIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
          UNSIGNED_RESEARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned_research }}
        run: |
          if ($env:UNSIGNED_RESEARCH -eq 'true') {
            python tools/build_exe.py --unsigned
          } else {
            if (-not $env:GEODRILL_SIGN_PFX_BASE64) { throw 'Trusted publisher PFX required for a tagged release' }
            $certificatePath = Join-Path $env:RUNNER_TEMP 'geodrill-publisher.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:GEODRILL_SIGN_PFX_BASE64))
            try {
              python tools/build_exe.py --sign --cert $certificatePath
              if ($LASTEXITCODE -ne 0) { throw 'Executable signing or packaging failed' }
            } finally {
              Remove-Item -LiteralPath $certificatePath -ErrorAction SilentlyContinue
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $env:GEODRILL_DATA_DIR = Join-Path $env:RUNNER_TEMP 'geodrill-smoke'
          $smoke = Start-Process -FilePath dist/GeoDrillPro/GeoDrillPro.exe -ArgumentList '--smoke-test','--no-browser' -WindowStyle Hidden -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw 'Packaged API/diagnostic smoke test failed' }
          if (-not (Test-Path -LiteralPath "$env:GEODRILL_DATA_DIR/smoke-test.json")) { throw 'Packaged smoke evidence missing' }
      - name: Install Inno Setup and compile installer
        run: |
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" tools/installer/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign installer for publisher releases
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.unsigned_research) }}
        shell: pwsh
        env:
          GEODRILL_SIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          GEODRILL_SIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'geodrill-publisher.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:GEODRILL_SIGN_PFX_BASE64))
          try {
            python tools/sign_windows_binary.py dist/GeoDrillPro-Setup.exe --cert $certificatePath
            if ($LASTEXITCODE -ne 0) { throw 'Installer publisher signature verification failed' }
          } finally {
            Remove-Item -LiteralPath $certificatePath -ErrorAction SilentlyContinue
          }
      - name: Verify artifacts and generate manifest/checksums
        shell: pwsh
        env:
          UNSIGNED_RESEARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned_research }}
        run: |
          if ($env:UNSIGNED_RESEARCH -eq 'true') {
            python tools/verify_windows_release.py --unsigned
          } else {
            python tools/verify_windows_release.py --signed
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer execution and recovery
        shell: pwsh
        run: |
          ./tools/test_windows_installer.ps1 -EvidencePath "$pwd/build/release-installer-verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-evidence
          path: |
            dist/release-manifest.json
            build/release-tests.xml
            build/release-installer-verification.json
            dist/GeoDrillPro/SOURCE-SNAPSHOT.json
      - name: Publish verified artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('research-{0}', github.run_number) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Unsigned research build {0}', github.run_number) || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned_research }}
          files: |
            dist/GeoDrillPro-Setup.exe
            dist/GeoDrillPro-Windows-x64.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          fail_on_unmatched_files: true
          body: |
            Engineering research workstation. Independent engineering qualification and external security review are pending.
            Signing status and exact SHA-256 artifact hashes are in release-manifest.json.
            Equipment control and automated drilling clearance are unavailable.
